apiVersion: v1
kind: ConfigMap
metadata:
  name: transformation-agent-config
  namespace: biller
data:
  APP_ENV: "production"
  AUTH_MODE: "ingress"
  INGRESS_CHANNEL_NAME: "REPLACE_CHANNEL_NAME"
  INGRESS_SERVICE_ID: "REPLACE_SERVICE_ID"
  INGRESS_SHARED_SUBJECT: "transformation-service"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://REPLACE_APPROVED_FRONTEND"
  DATABASE_URL: "postgresql+psycopg://REPLACE_USER:REPLACE_URL_ENCODED_PASSWORD@REPLACE_HOST:5432/REPLACE_DATABASE"
  JAVA_RUNTIME_URL: "http://REPLACE_JAVA_SERVICE:8080"
  JAVA_RUNTIME_TRANSFORM_PATH: "/transform"
  JAVA_RUNTIME_HEALTH_PATH: "/health"
  JAVA_RUNTIME_TIMEOUT_SECONDS: "10"
  JAVA_RUNTIME_BEARER_TOKEN: ""
  FEEDBACK_AUTO_TRAIN: "false"
  FEEDBACK_TRAIN_STEPS: "50"
  TRAINING_OPERATOR_IDS: ""
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
